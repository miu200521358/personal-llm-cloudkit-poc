name: Terraform Plan

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  plan:
    name: Terraform fmt/validate/plan
    runs-on: ubuntu-latest
    env:
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ secrets.GCP_REGION }}
      TF_VAR_gcs_bucket_name: ${{ format('{0}-llm-db', secrets.GCP_PROJECT_ID) }}
      TF_VAR_user_email: ${{ secrets.USER_EMAIL }}
      TF_STATE_BUCKET: ${{ format('{0}-tfstate', secrets.GCP_PROJECT_ID) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_JSON }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          export_environment_variables: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Terraform fmt check
        run: terraform -chdir=infra fmt -check

      - name: Ensure GCS bucket for Terraform state
        run: |
          if ! gcloud storage buckets describe gs://${TF_STATE_BUCKET} >/dev/null 2>&1; then
            gcloud storage buckets create gs://${TF_STATE_BUCKET} --location=${TF_VAR_region} --project=${TF_VAR_project_id}
          fi

      - name: Terraform init
        run: |
          terraform -chdir=infra init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=terraform/state"

      - name: Terraform validate
        run: terraform -chdir=infra validate

      - name: Terraform plan
        run: terraform -chdir=infra plan -input=false
